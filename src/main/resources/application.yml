spring:
  application:
    name: abogado

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/abogado}
    username: ${DB_USER:abogado}
    password: ${DB_PASSWORD:abogado}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false          # obliga a resolver el fetch en el service, no en la vista
    hibernate:
      ddl-auto: validate         # el esquema lo manda Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      # Nginx corta en 25m; aqui el limite es algo menor para que el error
      # lo devuelva la aplicacion y no el proxy.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  forward-headers-strategy: framework   # respeta X-Forwarded-* de Nginx

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

app:
  jwt:
    issuer: mi-abogado
    secret: ${JWT_SECRET:dev-secret-solo-para-local-cambiar-en-produccion-32b}
    access-token-ttl: PT30M
    refresh-token-ttl: P30D
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    # file:/run/secrets/firebase-service-account.json en prod; vacio = Firebase deshabilitado (tests)
    credentials-location: ${FIREBASE_CREDENTIALS:}
  bootstrap:
    super-admin-email: ${SUPER_ADMIN_EMAIL:}
  storage:
    # En Docker apunta a un volumen; en local, a una carpeta del proyecto.
    base-path: ${DOCUMENTS_PATH:./data/documents}
    # Lista blanca: un despacho sube PDF, imagenes y ofimatica. Sin ella el
    # almacen se convierte en un vector de distribucion de malware.
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/plain

---
spring:
  config.activate.on-profile: dev
  jpa.properties.hibernate.format_sql: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.mi.abogado: debug
